name: Clippy log (temporary)

on:
  workflow_dispatch:

jobs:
  clippy:
    name: Clippy log
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Clippy
        run: |
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings \
            2>&1 | tee clippy.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload clippy log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clippy-log
          path: clippy.log
          if-no-files-found: error
